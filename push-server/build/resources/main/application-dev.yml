## dev 프로파일 설정.
## 모든 값을 환경변수 대신 여기서 직접 설정한다. (운영/스테이징은 application-prod.yml 등으로 분리)
## TODO 표시된 값은 실제 dev 인프라 값으로 채워 넣어야 한다.

spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: localhost          # TODO: dev Redis 호스트
      port: 6379
      # password:              # 필요 시 주석 해제
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/air_bot   # TODO: dev DB URL
    username: dev               # TODO: dev DB 계정
    password: 1234              # TODO: dev DB 비밀번호
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 30000
      read-only: true

push:
  aws:
    region: ap-northeast-2
    # 정적 자격증명. 비워두면 ECS Task Role / 환경변수 등을 자동 탐색한다.
    # dev 로컬 테스트 시에만 채우고, 배포 환경에서는 비워서 Task Role 사용 권장.
    access-key-id:
    secret-access-key:
  kinesis:
    # 구독할 Kinesis 스트림 이름 목록. skmg/airbot/+/+/status 토픽이 흘러오는 스트림.
    # 비우면 컨슈머가 시작되지 않는다.
    stream-names:
      - skmg-airbot-kds-dev   # TODO: dev Kinesis 스트림 이름
    application-name: air-bot-push-server-dev   # KCL 앱 이름(접두사). DynamoDB 리스 테이블명에 사용
    initial-position: LATEST                     # LATEST 또는 TRIM_HORIZON
  websocket:
    # API Gateway WebSocket 관리(Management) endpoint (서버→클라이언트 push 용)
    endpoint: https://example.execute-api.ap-northeast-2.amazonaws.com/dev   # TODO: dev API Gateway WS 관리 endpoint
