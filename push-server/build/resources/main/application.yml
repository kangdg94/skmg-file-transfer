spring:
  application:
    name: air-bot-push-server
  profiles:
    # 기본 활성 프로파일. 운영/스테이징은 SPRING_PROFILES_ACTIVE 로 override (예: prod, stag)
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false
    default-statement-timeout: 3000

server:
  # /connect, /disconnect, actuator 헬스체크용 포트
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.skmagic.push: INFO
    software.amazon.kinesis: WARN
